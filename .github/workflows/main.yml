name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter --version
          flutter create --org in.nexatap --project-name nexa_tap --platforms android build_app
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp ci/flutter_launcher_icons.yaml build_app/

      - name: Add packages
        working-directory: build_app
        run: |
          flutter pub add supabase_flutter google_fonts qr_flutter image_picker url_launcher shared_preferences
          flutter pub add dev:flutter_launcher_icons

      - name: App icon and name
        run: |
          cd build_app && dart run flutter_launcher_icons && cd ..
          python3 ci/patch_android.py

      - name: Check code
        working-directory: build_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Rename APK
        run: cp build_app/build/app/outputs/flutter-apk/app-release.apk NexaTap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexaTap-apk
          path: NexaTap.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexa Tap build ${{ github.run_number }}
          body: Download NexaTap.apk below and open it on your Android phone to install.
          files: NexaTap.apk
          make_latest: true
